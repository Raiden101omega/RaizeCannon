# Blocks
block.raizecannon-biophage.name = Biophage
block.raizecannon-biophage.description = Organic flak cannon that fires a compact three-shot salvo. Hits air and ground. Accepts plastanium, surge alloy, and spore pods.
block.raizecannon-nanite-thrower.name = Nanite Thrower
block.raizecannon-nanite-thrower.description = Biotech liquid cannon that fires only Parasitic Nanites, infecting anything it hits.
block.raizecannon-nanite-culture-vat.name = Nanite Culture Vat
block.raizecannon-nanite-culture-vat.description = Grows Parasitic Nanites from spore pods, plastanium, and water. Feeds constructors and reconstructors.
block.raizecannon-nanite-constructor.name = Nanite Constructor
block.raizecannon-nanite-constructor.description = Grows the first generation of Raize organisms. Requires Parasitic Nanites for every growth cycle.
block.raizecannon-nanite-recombinator.name = Nanite Recombinator
block.raizecannon-nanite-recombinator.description = Recombines first-generation organisms into specialized second-generation forms.
block.raizecannon-mutagenic-reconstructor.name = Mutagenic Reconstructor
block.raizecannon-mutagenic-reconstructor.description = Mutates mature organisms into heavy combat forms.
block.raizecannon-apex-reconstructor.name = Apex Reconstructor
block.raizecannon-apex-reconstructor.description = Performs the final nanite-intensive mutation into apex organisms.

# Units
unit.raizecannon-raize-larva.name = Raize Larva
unit.raizecannon-raize-larva.description = Small disposable biotech crawler that swarms defenses with infected bites.
unit.raizecannon-raize-stalker.name = Raize Stalker
unit.raizecannon-raize-stalker.description = Medium biotech mech that fires hardened nanite darts.
unit.raizecannon-raize-wasp.name = Raize Wasp
unit.raizecannon-raize-wasp.description = Fast flying parasite that harasses exposed targets and spreads infection.
unit.raizecannon-brood-crawler.name = Brood Crawler
unit.raizecannon-brood-crawler.description = A reinforced larva with a stronger bite and a thick organic shell.
unit.raizecannon-spine-hunter.name = Spine Hunter
unit.raizecannon-spine-hunter.description = Upgraded stalker carrying a pair of corrosive spine launchers.
unit.raizecannon-miasma-wasp.name = Miasma Wasp
unit.raizecannon-miasma-wasp.description = Larger flying parasite that sprays infectious clouds around its target.
unit.raizecannon-carapace-beast.name = Carapace Beast
unit.raizecannon-carapace-beast.description = Heavy crawling organism built to absorb punishment and break defenses.
unit.raizecannon-plague-stalker.name = Plague Stalker
unit.raizecannon-plague-stalker.description = Long-range biotech artillery mech with concentrated nanite rounds.
unit.raizecannon-venom-wing.name = Venom Wing
unit.raizecannon-venom-wing.description = Swift airborne predator whose shots spread a concentrated nanite toxin.
unit.raizecannon-colossus-worm.name = Colossus Worm
unit.raizecannon-colossus-worm.description = Massive siege crawler with crushing jaws and extreme durability.
unit.raizecannon-necrotic-warden.name = Necrotic Warden
unit.raizecannon-necrotic-warden.description = Apex biotech mech that launches dense, armor-piercing infection darts.
unit.raizecannon-hive-mother.name = Hive Mother
unit.raizecannon-hive-mother.description = Huge flying brood organism that rains infectious projectiles over enemy lines.

# Liquids / status
liquid.raizecannon-parasitic-nanites.name = Parasitic Nanites
liquid.raizecannon-parasitic-nanites.description = A blue-black suspension of microscopic machines that infect living targets.
status.raizecannon-spore-sludge.name = Spore Sludge
status.raizecannon-spore-sludge.description = Sticky biological residue that slows movement.
status.raizecannon-nanite-infection.name = Nanite Infection
status.raizecannon-nanite-infection.description = Parasitic nanites damage the target and suppress its maximum health.
